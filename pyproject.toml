[project]
name = "graphix-stim-backend"
authors = [
    { name = "Maxime Garnier", email = "Maxime.Garnier@inria.fr" },
    { name = "Thierry Martinez", email = "Thierry.Martinez@inria.fr" },
]
maintainers = [
    { name = "Maxime Garnier", email = "Maxime.Garnier@inria.fr" },
    { name = "Thierry Martinez", email = "Thierry.Martinez@inria.fr" },
]
license-files = ["LICENSE"]
description = "Stim backend for efficient simulation of Clifford patterns with the Graphix library"
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11,<3.16"
version = "1"
dependencies = [
    "graphix>=0.4.1",
    "stim>=1.15,<2",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pyright",
    "ruff==0.14.14",
    "nox==2025.5.1",
    "pytest",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
# Allow "α" (U+03B1 GREEK SMALL LETTER ALPHA) which could be confused for "a"
# Allow "×" (U+00D7 MULTIPLICATION SIGN) which could be confused for "x"
allowed-confusables = ["α", "×"]
extend-ignore = [
    "D203", # `incorrect-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible.
    "D212", # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible.
    "COM812", # The following rule may cause conflicts when used with the formatter: `COM812`.
    "PLR2004", # Magic value used in comparison
    "E501", # Line too long
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "S101", # Use of `assert`
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# Keep in sync with pyright
files = ["*.py", "graphix_stim_backend", "tests"]
ignore_missing_imports = true
follow_untyped_imports = true
strict = true

[tool.pyright]
# Keep in sync with pyright
include = ["*.py", "graphix_stim_backend", "tests"]
typeCheckingMode = "strict"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "information"
reportUnknownParameterType = "error"
reportUnknownVariableType = "information"
